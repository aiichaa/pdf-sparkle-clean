services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-pdfclarity-frontend}
    ports:
      - "127.0.0.1:${APP_PORT:-3150}:3000"
    restart: unless-stopped
    # Hardening: the SSR server only needs to read its own bundle.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100
